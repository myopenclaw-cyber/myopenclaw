<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Startup Error</title><style>body{font-family:Inter,Arial,sans-serif;background:#f8f9fa;color:#1a1a1a;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}.card{background:#fff;border:1px solid #e9ecef;border-radius:14px;padding:24px;max-width:640px;box-shadow:0 8px 24px rgba(0,0,0,.08)}h1{margin:0 0 10px;font-size:24px}pre{background:#f0f2f5;border-radius:8px;padding:12px;white-space:pre-wrap}button{padding:10px 14px;border:none;border-radius:10px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;cursor:pointer}</style></head><body><div class="card"><h1>Gateway startup failed</h1><p>Please check configuration and try again.</p><pre id="err">Loading...</pre><button onclick="location.reload()">Retry</button></div><script>window.electronAPI?.getStartupError?.().then(r=>{document.getElementById('err').textContent=r?.error||'Unknown error';}).catch(()=>{document.getElementById('err').textContent='Unknown error';});</script></body></html>
