<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyOpenClaw - 设置</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .setup-container {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      text-align: center;
      color: rgba(255,255,255,0.7);
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }
    select, input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 16px;
      transition: border-color 0.2s;
    }
    select:focus, input:focus {
      outline: none;
      border-color: #4f9eff;
    }
    input::placeholder { color: rgba(255,255,255,0.5); }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #4f9eff 0%, #6366f1 100%);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }
    .btn:hover { transform: translateY(-2px); opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .error { color: #ff6b6b; text-align: center; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="setup-container">
    <h1>🐾 MyOpenClaw</h1>
    <p class="subtitle">让我们开始配置你的 AI 助手</p>
    
    <div class="form-group">
      <label>选择 AI 提供商</label>
      <select id="provider">
        <option value="openai">OpenAI</option>
        <option value="anthropic">Anthropic (Claude)</option>
        <option value="custom">自定义 (OpenAI 兼容)</option>
      </select>
    </div>
    
    <div class="form-group">
      <label>API Key</label>
      <input type="password" id="apiKey" placeholder="输入你的 API Key">
    </div>
    
    <div class="form-group" id="baseUrlGroup" style="display:none;">
      <label>Base URL</label>
      <input type="text" id="baseUrl" placeholder="https://api.example.com/v1">
    </div>
    
    <button class="btn" id="startBtn">开始使用</button>
    <p class="error" id="error"></p>
  </div>

  <script>
    const provider = document.getElementById('provider');
    const baseUrlGroup = document.getElementById('baseUrlGroup');
    const startBtn = document.getElementById('startBtn');
    const error = document.getElementById('error');

    provider.addEventListener('change', () => {
      baseUrlGroup.style.display = provider.value === 'custom' ? 'block' : 'none';
    });

    startBtn.addEventListener('click', async () => {
      const apiKey = document.getElementById('apiKey').value.trim();
      const baseUrl = document.getElementById('baseUrl').value.trim();

      if (!apiKey) {
        error.textContent = '请输入 API Key';
        return;
      }

      startBtn.disabled = true;
      startBtn.textContent = '正在配置...';
      error.textContent = '';

      try {
        const result = await window.electronAPI.saveConfig({
          provider: provider.value,
          apiKey,
          baseUrl: baseUrl || undefined
        });

        if (result.success) {
          window.location.href = 'index.html';
        } else {
          error.textContent = result.error || '配置失败';
          startBtn.disabled = false;
          startBtn.textContent = '开始使用';
        }
      } catch (e) {
        error.textContent = '配置失败: ' + e.message;
        startBtn.disabled = false;
        startBtn.textContent = '开始使用';
      }
    });
  </script>
</body>
</html>
