<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyOpenClaw</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;
      background:linear-gradient(135deg,#0f0f1a 0%,#1a1a2e 50%,#16213e 100%);
      min-height:100vh;display:grid;place-items:center;color:#e2e8f0;
      overflow:hidden;
    }
    .wrap{width:min(480px,88vw);text-align:center;padding:40px 24px}

    /* Logo area */
    .logo-area{position:relative;width:120px;height:120px;margin:0 auto 32px}
    .pulse{
      position:absolute;inset:-20px;border-radius:50%;
      background:radial-gradient(circle,rgba(99,102,241,.15) 0%,transparent 70%);
      animation:pulse 3s ease-in-out infinite;
    }
    .logo-ring{
      position:absolute;inset:0;border-radius:50%;
      border:2px solid rgba(99,102,241,.3);
      animation:spin 8s linear infinite;
    }
    .logo-ring::after{
      content:'';position:absolute;top:-3px;left:50%;width:6px;height:6px;
      border-radius:50%;background:#818cf8;transform:translateX(-50%);
    }
    .logo-icon{
      position:absolute;inset:16px;display:grid;place-items:center;
      border-radius:50%;
      background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(139,92,246,.1));
      backdrop-filter:blur(10px);
      border:1px solid rgba(99,102,241,.2);
      font-size:36px;
    }

    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.8;transform:scale(1.1)}}

    /* Status text */
    .status{
      font-size:13px;color:#94a3b8;letter-spacing:.3px;
      min-height:20px;margin-bottom:20px;
      transition:all .3s ease;
    }

    /* Progress bar */
    .bar-wrap{
      width:100%;padding:0 20px;margin-bottom:12px;
    }
    .bar{
      width:100%;height:3px;border-radius:99px;
      background:rgba(99,102,241,.1);overflow:hidden;
    }
    .fill{
      height:100%;width:48%;border-radius:99px;
      background:linear-gradient(90deg,#6366f1,#818cf8,#a78bfa);
      transition:width .5s cubic-bezier(.4,0,.2,1);
      box-shadow:0 0 12px rgba(99,102,241,.4);
    }

    /* Percentage */
    .pct{
      font-size:11px;color:#64748b;font-variant-numeric:tabular-nums;
      margin-bottom:28px;
    }

    /* Feature pills */
    .features{
      display:flex;flex-wrap:wrap;justify-content:center;gap:8px;
      margin-bottom:24px;
    }
    .pill{
      font-size:11px;color:#94a3b8;
      padding:5px 12px;border-radius:99px;
      background:rgba(99,102,241,.06);
      border:1px solid rgba(99,102,241,.12);
      transition:all .3s ease;
    }
    .pill.done{color:#818cf8;border-color:rgba(99,102,241,.25);background:rgba(99,102,241,.1)}

    /* Tip */
    .tip{
      font-size:11px;color:#475569;
      opacity:0;transition:opacity .5s ease;
      margin-top:8px;
    }
    .tip.show{opacity:1}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo-area">
      <div class="pulse"></div>
      <div class="logo-ring"></div>
      <div class="logo-icon">🐾</div>
    </div>

    <div class="status" id="status">Initializing...</div>

    <div class="bar-wrap">
      <div class="bar"><div class="fill" id="fill"></div></div>
    </div>
    <div class="pct" id="pct">48%</div>

    <div class="features" id="features">
      <span class="pill" data-step="20">Environment</span>
      <span class="pill" data-step="50">Runtime</span>
      <span class="pill" data-step="80">Gateway</span>
      <span class="pill" data-step="95">Ready</span>
    </div>

    <div class="tip" id="tip">First launch downloads the runtime — this may take a moment</div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const fillEl = document.getElementById('fill');
    const pctEl = document.getElementById('pct');
    const tipEl = document.getElementById('tip');
    const pills = document.querySelectorAll('.pill');

    // Show tip after 3s
    setTimeout(() => tipEl.classList.add('show'), 3000);

    function updatePills(pct) {
      pills.forEach(p => {
        const step = parseInt(p.dataset.step);
        p.classList.toggle('done', pct >= step);
      });
    }

    window.setLoadingState = (message, pct) => {
      const p = Math.max(1, Math.min(100, Number(pct || 0)));
      statusEl.textContent = message;
      fillEl.style.width = p + '%';
      pctEl.textContent = p + '%';
      updatePills(p);
    };

    window.setRuntimeDownloadNeeded = (needed) => {
      if (needed) tipEl.classList.add('show');
    };

    // Fallback animation when no real updates come
    const fallbackSteps = [
      ['Establishing secure connections...', 48],
      ['Preparing runtime environment...', 56],
      ['Launching gateway...', 82],
      ['Finalizing...', 95]
    ];
    let i = 0;
    setInterval(() => {
      if (window.__REAL_LOADING_DRIVEN__) return;
      i = (i + 1) % fallbackSteps.length;
      window.setLoadingState(fallbackSteps[i][0], fallbackSteps[i][1]);
    }, 2000);
  </script>
</body>
</html>
