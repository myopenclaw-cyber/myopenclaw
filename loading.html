<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyOpenClaw</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:#FFFFFF;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#161835;
      overflow:hidden;
    }
    .wrap{
      width:min(680px,90vw);
      text-align:center;
      padding:40px 24px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    /* Logo area */
    .logo-area{
      position:relative;
      width:180px;
      height:180px;
      margin:0 auto 28px;
      order:1;
    }
    .pulse{display:none}
    .logo-ring{display:none}
    .logo-icon{
      position:absolute;
      inset:0;
      border-radius:50%;
      background:
        url('./build/assets/logo-openclaw.png') center/65% no-repeat,
        linear-gradient(-11deg,rgba(233,224,255,1) 13%,rgba(255,255,255,1) 100%);
      font-size:0;
    }

    /* Feature pills - visually reordered after logo */
    .features{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:20px 32px;
      margin-bottom:20px;
      order:2;
    }
    .pill{
      display:flex;
      align-items:center;
      gap:12px;
      font-size:16px;
      font-weight:500;
      color:#000000;
      background:none;
      border:none;
      padding:0;
      border-radius:0;
      transition:all .3s ease;
      white-space:nowrap;
    }
    .pill::before{
      content:'✓';
      display:flex;
      align-items:center;
      justify-content:center;
      width:36px;
      height:36px;
      min-width:36px;
      border-radius:50%;
      background:rgba(107,70,255,0.08);
      border:1px solid rgba(107,70,255,0.2);
      color:rgba(107,70,255,0.3);
      font-size:14px;
      font-weight:700;
    }
    .pill.done::before{
      background:rgba(107,70,255,0.12);
      border-color:#6B46FF;
      color:#6B46FF;
    }

    /* Tip / hint box */
    .tip{
      font-size:16px;
      font-weight:500;
      color:rgba(0,0,0,0.4);
      background:#FFFFFF;
      border:1px solid rgba(0,0,0,0.04);
      box-shadow:0px 10px 40px 0px rgba(0,0,0,0.04);
      border-radius:20px;
      padding:13px 20px;
      margin-bottom:20px;
      order:3;
      opacity:0;
      transition:opacity .5s ease;
      width:100%;
    }
    .tip.show{opacity:1}

    /* Status text */
    .status{
      font-size:20px;
      font-weight:600;
      color:#161835;
      min-height:30px;
      margin-bottom:10px;
      transition:all .3s ease;
      order:4;
    }

    /* Progress bar */
    .bar-wrap{
      width:100%;
      margin-bottom:10px;
      order:5;
    }
    .bar{
      width:100%;
      height:20px;
      border-radius:20px;
      background:#D9D9D9;
      overflow:hidden;
    }
    .fill{
      height:100%;
      width:48%;
      border-radius:20px;
      background:linear-gradient(90deg,rgba(93,104,255,1) 0%,rgba(140,70,252,1) 100%);
      transition:width .5s cubic-bezier(.4,0,.2,1);
    }

    /* Percentage */
    .pct{
      font-size:13px;
      color:rgba(0,0,0,0.4);
      font-variant-numeric:tabular-nums;
      order:6;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo-area">
      <div class="pulse"></div>
      <div class="logo-ring"></div>
      <div class="logo-icon">🐾</div>
    </div>

    <div class="status" id="status">Initializing...</div>

    <div class="bar-wrap">
      <div class="bar"><div class="fill" id="fill"></div></div>
    </div>
    <div class="pct" id="pct">48%</div>

    <div class="features" id="features">
      <span class="pill" data-step="20">Environment</span>
      <span class="pill" data-step="50">Runtime</span>
      <span class="pill" data-step="80">Gateway</span>
      <span class="pill" data-step="95">Ready</span>
    </div>

    <div class="tip" id="tip">First launch downloads the runtime — this may take a moment</div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const fillEl = document.getElementById('fill');
    const pctEl = document.getElementById('pct');
    const tipEl = document.getElementById('tip');
    const pills = document.querySelectorAll('.pill');

    // Show tip after 3s
    setTimeout(() => tipEl.classList.add('show'), 3000);

    function updatePills(pct) {
      pills.forEach(p => {
        const step = parseInt(p.dataset.step);
        p.classList.toggle('done', pct >= step);
      });
    }

    window.setLoadingState = (message, pct) => {
      const p = Math.max(1, Math.min(100, Number(pct || 0)));
      statusEl.textContent = message;
      fillEl.style.width = p + '%';
      pctEl.textContent = p + '%';
      updatePills(p);
    };

    window.setRuntimeDownloadNeeded = (needed) => {
      if (needed) tipEl.classList.add('show');
    };

    // Fallback animation when no real updates come
    const fallbackSteps = [
      ['Establishing secure connections...', 48],
      ['Preparing runtime environment...', 56],
      ['Launching gateway...', 82],
      ['Finalizing...', 95]
    ];
    let i = 0;
    setInterval(() => {
      if (window.__REAL_LOADING_DRIVEN__) return;
      i = (i + 1) % fallbackSteps.length;
      window.setLoadingState(fallbackSteps[i][0], fallbackSteps[i][1]);
    }, 2000);
  </script>
</body>
</html>
