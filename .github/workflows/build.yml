name: Build MyOpenClaw

on:
  push:
    tags:
      - 'v*'
      - 'beta-*'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: false
        default: 'V3'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          Write-Host "Setting package.json version to $version"
          npm version $version --no-git-tag-version --allow-same-version
        shell: powershell

      - name: Sync version from beta tag
        if: startsWith(github.ref, 'refs/tags/beta-')
        run: |
          # beta-0.3.63.1 → 0.3.63-beta.1
          $tag = "${{ github.ref_name }}" -replace '^beta-', ''
          if ($tag -match '^(\d+\.\d+\.\d+)\.(\d+)$') {
            $version = "$($Matches[1])-beta.$($Matches[2])"
          } else {
            $version = "$tag-beta"
          }
          Write-Host "Setting package.json version to $version"
          npm version $version --no-git-tag-version --allow-same-version
        shell: powershell

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript
        run: npm run build:ts

      - name: Run tests
        run: npm test

      - name: Build Windows Simple
        run: |
          $env:BUILD_VARIANT="simple"
          npx electron-builder --win --x64 --publish never -c build/simple.json --config.compression=maximum
        shell: powershell

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyOpenClaw-Windows-x64
          path: |
            dist/**/*-simple-*.exe
            dist/**/*-simple-*.exe.blockmap
            dist/**/latest.yml

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting package.json version to $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Sync version from beta tag
        if: startsWith(github.ref, 'refs/tags/beta-')
        run: |
          # beta-0.3.63.1 → 0.3.63-beta.1
          TAG="${GITHUB_REF_NAME#beta-}"
          if [[ "$TAG" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\.([0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}-beta.${BASH_REMATCH[2]}"
          else
            VERSION="${TAG}-beta"
          fi
          echo "Setting package.json version to $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript
        run: npm run build:ts

      - name: Run tests
        run: npm test

      - name: Import signing certificate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          echo "$CSC_LINK" | base64 --decode > /tmp/signing.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/signing.p12 -k build.keychain -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          rm /tmp/signing.p12

      - name: Build Mac Simple (signed)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BUILD_VARIANT: simple
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          npx electron-builder --mac --x64 --arm64 --publish never -c build/simple.json --config.compression=maximum --config.directories.output=dist-mac

      - name: Build Mac Simple (unsigned)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          BUILD_VARIANT: simple
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder --mac --x64 --arm64 --publish never -c build/simple.json --config.compression=maximum --config.directories.output=dist-mac --config.mac.notarize=false

      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyOpenClaw-Mac
          path: |
            dist-mac/**/*-simple-*.dmg
            dist-mac/**/*-simple-*.zip
            dist-mac/**/*-simple-*.blockmap
            dist-mac/**/latest-mac.yml

  create-release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Display structure of downloaded files
        run: ls -R ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/**/*-simple-*.exe
            ./artifacts/**/*-simple-*.dmg
            ./artifacts/**/*-simple-*.zip
            ./artifacts/**/*-simple-*.blockmap
            ./artifacts/**/latest.yml
            ./artifacts/**/latest-mac.yml
          draft: false
          prerelease: false
          body: |
            ## MyOpenClaw Release

            ### Downloads
            - **Windows 10/11 (64-bit)**: MyOpenClaw-simple-x64.exe
            - **macOS Apple Silicon (M1/M2/M3/M4)**: MyOpenClaw-simple-arm64.dmg
            - **macOS Intel**: MyOpenClaw-simple-x64.dmg

            ### Installation
            1. Download the appropriate file for your platform
            2. Run the installer (Windows) or open DMG and drag to Applications (Mac)
            3. MyOpenClaw will automatically download OpenClaw on first launch

            ### Notes
            - This is the Simple version (lightweight, ~80MB)
            - OpenClaw runtime will be downloaded automatically on first launch
            - Auto-update metadata is published with each release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
