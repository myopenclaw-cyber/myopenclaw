name: Build OpenClaw Runtime Packages

on:
  push:
    tags:
      - 'runtime-v*'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: false
        default: 'V3'
      runtime_tag:
        description: 'Runtime tag to publish/update (for example: runtime-v1.1.1)'
        required: false
        default: ''

jobs:
  build-windows-runtime:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          lfs: true

      - name: Check openclaw-deps exists
        run: |
          if (Test-Path "resources/openclaw-deps") {
            Write-Host "openclaw-deps found"
          } else {
            Write-Host "openclaw-deps not found"
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install openclaw dist from npm
        run: |
          cd resources/openclaw-deps/openclaw
          OPENCLAW_VERSION=$(node -p "require('./package.json').version")
          echo "Installing openclaw@${OPENCLAW_VERSION} from npm..."
          cd /tmp
          npm pack "openclaw@${OPENCLAW_VERSION}"
          tar xzf "openclaw-${OPENCLAW_VERSION}.tgz"
          cp -r package/dist "$GITHUB_WORKSPACE/resources/openclaw-deps/openclaw/"
          echo "dist/ copied successfully"
        shell: bash

      - name: Install production dependencies
        run: |
          cd resources/openclaw-deps/openclaw
          npm install --omit=dev --legacy-peer-deps
        shell: bash

      - name: Verify dist exists
        run: |
          if (Test-Path "resources/openclaw-deps/openclaw/dist/entry.js") {
            Write-Host "dist/entry.js found"
          } elseif (Test-Path "resources/openclaw-deps/openclaw/dist/entry.mjs") {
            Write-Host "dist/entry.mjs found"
          } else {
            Write-Host "dist/entry.(m)js not found"
            exit 1
          }

      - name: Bundle Node.js binary
        run: |
          $NODE_VERSION = (Get-Content "resources/node-version.json" | ConvertFrom-Json).version
          Write-Host "Downloading Node.js v${NODE_VERSION} for Windows x64..."
          $url = "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile "node-win.zip"
          New-Item -ItemType Directory -Path "resources/node" -Force | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("node-win.zip")
          $entry = $zip.Entries | Where-Object { $_.Name -eq "node.exe" } | Select-Object -First 1
          [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, "resources/node/node.exe", $true)
          $zip.Dispose()
          Remove-Item "node-win.zip"
          Write-Host "Node.js binary bundled: $(Get-Item 'resources/node/node.exe' | ForEach-Object { [math]::Round($_.Length/1MB, 1) }) MB"

      - name: Create output directory
        run: |
          New-Item -ItemType Directory -Path "dist/first-launch-runtime" -Force | Out-Null

      - name: Package Windows runtime
        run: |
          cd resources
          tar -a -cf ../dist/first-launch-runtime/openclaw-runtime-windows.zip openclaw-deps node

      - name: Verify package
        run: |
          $file = "dist/first-launch-runtime/openclaw-runtime-windows.zip"
          if (Test-Path $file) {
            $size = (Get-Item $file).Length / 1MB
            Write-Host "Package created: $([math]::Round($size, 2)) MB"
          } else {
            Write-Host "Package not found"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-runtime-windows
          path: dist/first-launch-runtime/openclaw-runtime-windows.zip
          retention-days: 7

  build-mac-silicon-runtime:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          lfs: true

      - name: Check openclaw-deps exists
        run: |
          if [ -d "resources/openclaw-deps" ]; then
            echo "openclaw-deps found"
          else
            echo "openclaw-deps not found"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install openclaw dist from npm
        run: |
          cd resources/openclaw-deps/openclaw
          OPENCLAW_VERSION=$(node -p "require('./package.json').version")
          echo "Installing openclaw@${OPENCLAW_VERSION} from npm..."
          cd /tmp
          npm pack "openclaw@${OPENCLAW_VERSION}"
          tar xzf "openclaw-${OPENCLAW_VERSION}.tgz"
          cp -r package/dist "$GITHUB_WORKSPACE/resources/openclaw-deps/openclaw/"
          echo "dist/ copied successfully"

      - name: Install production dependencies
        run: |
          cd resources/openclaw-deps/openclaw
          npm install --omit=dev --legacy-peer-deps

      - name: Verify dist exists
        run: |
          if [ -f "resources/openclaw-deps/openclaw/dist/entry.js" ] || [ -f "resources/openclaw-deps/openclaw/dist/entry.mjs" ]; then
            echo "dist/entry found"
          else
            echo "dist/entry.(m)js not found"
            exit 1
          fi

      - name: Bundle Node.js binary
        run: |
          NODE_VERSION=$(python3 -c "import json; print(json.load(open('resources/node-version.json'))['version'])")
          echo "Downloading Node.js v${NODE_VERSION} for macOS ARM64..."
          curl -Lo node-mac.tar.gz "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-darwin-arm64.tar.gz"
          mkdir -p resources/node
          tar xzf node-mac.tar.gz --strip-components=2 -C resources/node "node-v${NODE_VERSION}-darwin-arm64/bin/node"
          chmod +x resources/node/node
          rm node-mac.tar.gz
          echo "Node.js binary bundled: $(du -m resources/node/node | cut -f1) MB"

      - name: Create output directory
        run: mkdir -p dist/first-launch-runtime

      - name: Package macOS Apple Silicon runtime
        run: |
          cd resources
          zip -r -y ../dist/first-launch-runtime/openclaw-runtime-mac-silicon.zip openclaw-deps node

      - name: Verify package
        run: |
          file="dist/first-launch-runtime/openclaw-runtime-mac-silicon.zip"
          if [ -f "$file" ]; then
            size=$(du -m "$file" | cut -f1)
            echo "Package created: ${size} MB"
          else
            echo "Package not found"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-runtime-mac-silicon
          path: dist/first-launch-runtime/openclaw-runtime-mac-silicon.zip
          retention-days: 7

  build-mac-intel-runtime:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          lfs: true

      - name: Check openclaw-deps exists
        run: |
          if [ -d "resources/openclaw-deps" ]; then
            echo "openclaw-deps found"
          else
            echo "openclaw-deps not found"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install openclaw dist from npm
        run: |
          cd resources/openclaw-deps/openclaw
          OPENCLAW_VERSION=$(node -p "require('./package.json').version")
          echo "Installing openclaw@${OPENCLAW_VERSION} from npm..."
          cd /tmp
          npm pack "openclaw@${OPENCLAW_VERSION}"
          tar xzf "openclaw-${OPENCLAW_VERSION}.tgz"
          cp -r package/dist "$GITHUB_WORKSPACE/resources/openclaw-deps/openclaw/"
          echo "dist/ copied successfully"

      - name: Install production dependencies
        run: |
          cd resources/openclaw-deps/openclaw
          npm install --omit=dev --legacy-peer-deps

      - name: Verify dist exists
        run: |
          if [ -f "resources/openclaw-deps/openclaw/dist/entry.js" ] || [ -f "resources/openclaw-deps/openclaw/dist/entry.mjs" ]; then
            echo "dist/entry found"
          else
            echo "dist/entry.(m)js not found"
            exit 1
          fi

      - name: Bundle Node.js binary
        run: |
          NODE_VERSION=$(python3 -c "import json; print(json.load(open('resources/node-version.json'))['version'])")
          echo "Downloading Node.js v${NODE_VERSION} for macOS x64..."
          curl -Lo node-mac.tar.gz "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-darwin-x64.tar.gz"
          mkdir -p resources/node
          tar xzf node-mac.tar.gz --strip-components=2 -C resources/node "node-v${NODE_VERSION}-darwin-x64/bin/node"
          chmod +x resources/node/node
          rm node-mac.tar.gz
          echo "Node.js binary bundled: $(du -m resources/node/node | cut -f1) MB"

      - name: Create output directory
        run: mkdir -p dist/first-launch-runtime

      - name: Package macOS Intel runtime
        run: |
          cd resources
          zip -r -y ../dist/first-launch-runtime/openclaw-runtime-mac-intel.zip openclaw-deps node

      - name: Verify package
        run: |
          file="dist/first-launch-runtime/openclaw-runtime-mac-intel.zip"
          if [ -f "$file" ]; then
            size=$(du -m "$file" | cut -f1)
            echo "Package created: ${size} MB"
          else
            echo "Package not found"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-runtime-mac-intel
          path: dist/first-launch-runtime/openclaw-runtime-mac-intel.zip
          retention-days: 7

  create-release:
    needs: [build-windows-runtime, build-mac-silicon-runtime, build-mac-intel-runtime]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          lfs: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          ls -lh artifacts/*/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.runtime_tag || github.ref_name }}
          files: |
            artifacts/openclaw-runtime-windows/openclaw-runtime-windows.zip
            artifacts/openclaw-runtime-mac-silicon/openclaw-runtime-mac-silicon.zip
            artifacts/openclaw-runtime-mac-intel/openclaw-runtime-mac-intel.zip
          draft: false
          prerelease: false
          body: |
            OpenClaw Runtime Packages (self-contained with Node.js)

            Available platforms:
            - Windows x64
            - macOS Apple Silicon (M1/M2/M3/M4)
            - macOS Intel (x86_64)

            Includes bundled Node.js binary — no external dependencies required.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload runtime packages to R2 CDN
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || secrets.CLOUDFLARE_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          TAG_NAME="${{ github.event.inputs.runtime_tag || github.ref_name }}"
          if [ -z "$TAG_NAME" ]; then
            echo "Missing runtime tag. Provide workflow_dispatch input runtime_tag or push a runtime-v* tag."
            exit 1
          fi
          RUNTIME_VERSION="${TAG_NAME#runtime-}"

          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_BUCKET" ]; then
            echo "Missing R2 configuration. Expected secrets: R2_ACCOUNT_ID/R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY/R2_BUCKET"
            echo "or CLOUDFLARE_ACCOUNT_ID/CLOUDFLARE_R2_ACCESS_KEY_ID/CLOUDFLARE_R2_SECRET_ACCESS_KEY/CLOUDFLARE_R2_BUCKET"
            exit 1
          fi

          ENDPOINT_URL="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          RUNTIME_PREFIX="runtime/${RUNTIME_VERSION}"

          aws s3 cp artifacts/openclaw-runtime-windows/openclaw-runtime-windows.zip "s3://${R2_BUCKET}/${RUNTIME_PREFIX}/openclaw-runtime-windows.zip" \
            --endpoint-url "${ENDPOINT_URL}" \
            --content-type application/zip

          aws s3 cp artifacts/openclaw-runtime-mac-silicon/openclaw-runtime-mac-silicon.zip "s3://${R2_BUCKET}/${RUNTIME_PREFIX}/openclaw-runtime-mac-silicon.zip" \
            --endpoint-url "${ENDPOINT_URL}" \
            --content-type application/zip

          aws s3 cp artifacts/openclaw-runtime-mac-intel/openclaw-runtime-mac-intel.zip "s3://${R2_BUCKET}/${RUNTIME_PREFIX}/openclaw-runtime-mac-intel.zip" \
            --endpoint-url "${ENDPOINT_URL}" \
            --content-type application/zip

          echo "Uploaded runtime packages to R2 path: ${RUNTIME_PREFIX}"

      - name: Get release URLs
        run: |
          TAG_NAME="${{ github.event.inputs.runtime_tag || github.ref_name }}"
          if [ -z "$TAG_NAME" ]; then
            echo "Missing runtime tag. Provide workflow_dispatch input runtime_tag or push a runtime-v* tag."
            exit 1
          fi
          RUNTIME_VERSION="${TAG_NAME#runtime-}"
          REPO="${{ github.repository }}"
          echo "Windows: https://github.com/${REPO}/releases/download/${TAG_NAME}/openclaw-runtime-windows.zip"
          echo "Mac Silicon: https://github.com/${REPO}/releases/download/${TAG_NAME}/openclaw-runtime-mac-silicon.zip"
          echo "Mac Intel: https://github.com/${REPO}/releases/download/${TAG_NAME}/openclaw-runtime-mac-intel.zip"
          echo "CDN Windows: https://cdn.myopenclaws.app/runtime/${RUNTIME_VERSION}/openclaw-runtime-windows.zip"
          echo "CDN Mac Silicon: https://cdn.myopenclaws.app/runtime/${RUNTIME_VERSION}/openclaw-runtime-mac-silicon.zip"
          echo "CDN Mac Intel: https://cdn.myopenclaws.app/runtime/${RUNTIME_VERSION}/openclaw-runtime-mac-intel.zip"
