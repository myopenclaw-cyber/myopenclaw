name: Verify Client Installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to verify (e.g. v0.3.6)'
        required: false
        default: 'v0.3.6'

jobs:
  verify-mac:
    runs-on: macos-latest
    steps:
      - name: Cleanup workspace
        run: rm -rf ./artifacts ./screenshots

      - name: Download Mac Silicon DMG
        run: |
          gh release download ${{ github.event.inputs.version }} \
            --repo myopenclaw-cyber/myopenclaw \
            --pattern "*mac_silicon*" \
            --dir ./artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify DMG and version
        run: |
          DMG=$(ls ./artifacts/*.dmg)
          SIZE=$(stat -f%z "$DMG")
          echo "DMG: $(basename $DMG)  Size: ${SIZE} bytes"
          if [ "$SIZE" -lt 10000000 ]; then echo "ERROR: DMG too small"; exit 1; fi
          hdiutil attach "$DMG" -mountpoint /Volumes/MyOpenClaw -nobrowse -quiet
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" \
            "/Volumes/MyOpenClaw/MyOpenClaw.app/Contents/Info.plist")
          EXPECTED="${{ github.event.inputs.version }}"
          echo "Version: $VERSION  (expected ${EXPECTED#v})"
          [ "$VERSION" = "${EXPECTED#v}" ] || { echo "ERROR: Version mismatch"; exit 1; }

      - name: Launch app and capture screenshots
        run: |
          mkdir -p ./screenshots
          APP="/Volumes/MyOpenClaw/MyOpenClaw.app"

          # Kill any previous instance
          pkill -x "MyOpenClaw" 2>/dev/null || true
          sleep 1

          echo "Launching $APP ..."
          open -n "$APP"

          take_screenshot() {
            osascript -e 'tell application "MyOpenClaw" to activate' 2>/dev/null || true
            sleep 1
            screencapture -x "$1"
            echo "Saved: $1"
          }

          sleep 5;  take_screenshot ./screenshots/mac_01_startup.png
          sleep 15; take_screenshot ./screenshots/mac_02_downloading.png
          sleep 20; take_screenshot ./screenshots/mac_03_ready.png

          if pgrep -x "MyOpenClaw" > /dev/null; then
            echo "PASSED: App running"
            pkill -x "MyOpenClaw" || true
          else
            echo "FAILED: App not running"
            exit 1
          fi

      - name: Upload Mac screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-mac-${{ github.event.inputs.version }}
          path: ./screenshots/
          retention-days: 14

      - name: Cleanup
        if: always()
        run: |
          hdiutil detach /Volumes/MyOpenClaw -quiet 2>/dev/null || true
          rm -rf ./artifacts

  verify-windows:
    runs-on: [self-hosted, windows]
    steps:
      - name: Cleanup workspace
        shell: powershell
        run: Remove-Item -Recurse -Force ./artifacts, ./screenshots -ErrorAction SilentlyContinue

      - name: Download Windows EXE
        shell: powershell
        run: |
          gh release download ${{ github.event.inputs.version }} `
            --repo myopenclaw-cyber/myopenclaw `
            --pattern "*windows*" `
            --dir ./artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and install
        shell: powershell
        run: |
          $exe = Get-Item "./artifacts/*.exe"
          Write-Host "File: $($exe.Name)  Size: $($exe.Length) bytes"
          if ($exe.Length -lt 10MB) { Write-Host "ERROR: too small"; exit 1 }
          Write-Host "Version: $($exe.VersionInfo.FileVersion)"

          # Kill any previous instance
          Get-Process MyOpenClaw -ErrorAction SilentlyContinue | Stop-Process -Force

          Write-Host "Installing silently..."
          Start-Process -FilePath $exe.FullName -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 5

      - name: Find installed app
        shell: powershell
        run: |
          $candidates = @(
            "$env:LOCALAPPDATA\Programs\MyOpenClaw\MyOpenClaw.exe",
            "$env:ProgramFiles\MyOpenClaw\MyOpenClaw.exe"
          )
          $appPath = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $appPath) {
            $appPath = Get-ChildItem "$env:LOCALAPPDATA", "$env:ProgramFiles" `
              -Recurse -Filter MyOpenClaw.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $appPath) { Write-Host "ERROR: App not found after install"; exit 1 }
          Write-Host "App installed at: $appPath"
          "APP_PATH=$appPath" | Out-File -Append $env:GITHUB_ENV

      - name: Launch app and capture screenshots
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ./screenshots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing

          function Take-Screenshot($path) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap($b.Width, $b.Height)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save((Resolve-Path ".").Path + "\" + $path)
            $g.Dispose(); $bmp.Dispose()
            Write-Host "Saved: $path"
          }

          $proc = Start-Process -FilePath $env:APP_PATH -PassThru

          Start-Sleep -Seconds 5;  Take-Screenshot "screenshots/win_01_startup.png"
          Start-Sleep -Seconds 15; Take-Screenshot "screenshots/win_02_downloading.png"
          Start-Sleep -Seconds 20; Take-Screenshot "screenshots/win_03_ready.png"

          if (-not $proc.HasExited) {
            Write-Host "PASSED: App running (PID $($proc.Id))"
            $proc.Kill()
          } else {
            Write-Host "FAILED: App exited (code $($proc.ExitCode))"
            exit 1
          }

      - name: Upload Windows screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows-${{ github.event.inputs.version }}
          path: ./screenshots/
          retention-days: 14

      - name: Cleanup
        if: always()
        shell: powershell
        run: Remove-Item -Recurse -Force ./artifacts -ErrorAction SilentlyContinue
