name: Verify Client Installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to verify (e.g. v0.3.6)'
        required: false
        default: 'v0.3.6'

jobs:
  # ──────────────────────────────────────────────
  # E2E test on Windows (Playwright + Electron)
  # Caches OpenClaw runtime so download only happens once
  # ──────────────────────────────────────────────
  e2e-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: V3

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript
        run: npm run build:ts

      - name: Install Playwright browsers
        run: npx playwright install chromium

      # Cache OpenClaw runtime (~/.openclaw) — only download once
      - name: Cache OpenClaw runtime
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\.openclaw
            ~\.openclaw
          key: openclaw-runtime-windows-v1
          restore-keys: openclaw-runtime-windows-

      - name: Run E2E tests
        run: npm run test:e2e
        timeout-minutes: 10

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-windows-${{ github.event.inputs.version }}
          path: e2e-screenshots/
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-windows-${{ github.event.inputs.version }}
          path: e2e-report/
          retention-days: 14

  # ──────────────────────────────────────────────
  # Installer integrity check for all platforms
  # ──────────────────────────────────────────────
  verify-installers:
    runs-on: ubuntu-latest
    steps:
      - name: Download all release assets
        run: |
          gh release download ${{ github.event.inputs.version }} \
            --repo myopenclaw-cyber/myopenclaw \
            --dir ./artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all installers exist and are valid size
        run: |
          echo "=== Release assets ==="
          ls -lh ./artifacts/

          for f in ./artifacts/*; do
            SIZE=$(stat -c%s "$f")
            NAME=$(basename "$f")
            if [ "$SIZE" -lt 10000000 ]; then
              echo "FAIL: $NAME is too small ($SIZE bytes)"
              exit 1
            fi
            echo "OK: $NAME ($((SIZE/1024/1024)) MB)"
          done

      - name: Upload artifact list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ github.event.inputs.version }}
          path: ./artifacts/
          retention-days: 3
