name: Verify Client Installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to verify (e.g. v0.3.6)'
        required: false
        default: 'v0.3.6'

jobs:
  verify-mac:
    runs-on: macos-latest
    steps:
      - name: Download Mac Silicon DMG
        run: |
          gh release download ${{ github.event.inputs.version }} \
            --repo myopenclaw-cyber/myopenclaw \
            --pattern "*mac_silicon*" \
            --dir ./artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify DMG file
        run: |
          ls -lh ./artifacts/
          DMG=$(ls ./artifacts/*.dmg)
          SIZE=$(stat -f%z "$DMG")
          echo "DMG size: $SIZE bytes"
          if [ "$SIZE" -lt 10000000 ]; then
            echo "ERROR: DMG too small, likely corrupt"
            exit 1
          fi
          echo "File size OK"

      - name: Mount DMG and inspect app bundle
        run: |
          DMG=$(ls ./artifacts/*.dmg)
          hdiutil attach "$DMG" -mountpoint /Volumes/MyOpenClaw -nobrowse -quiet
          ls -la /Volumes/MyOpenClaw/
          APP="/Volumes/MyOpenClaw/MyOpenClaw.app"
          ls -la "$APP/Contents/"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Contents/Info.plist")
          EXPECTED="${{ github.event.inputs.version }}"
          echo "App version: $VERSION  (expected ${EXPECTED#v})"
          if [ "$VERSION" != "${EXPECTED#v}" ]; then
            echo "ERROR: Version mismatch!"
            exit 1
          fi

      - name: Launch app and capture screenshots
        run: |
          mkdir -p ./screenshots
          APP="/Volumes/MyOpenClaw/MyOpenClaw.app"
          echo "Launching app..."
          open "$APP"

          # screenshot at 3s (loading screen)
          sleep 3
          screencapture -x ./screenshots/mac_01_loading.png

          # screenshot at 8s (main UI or setup screen)
          sleep 5
          screencapture -x ./screenshots/mac_02_main.png

          # screenshot at 14s (fully loaded)
          sleep 6
          screencapture -x ./screenshots/mac_03_loaded.png

          if pgrep -x "MyOpenClaw" > /dev/null; then
            echo "PASSED: App is running after 14 seconds"
            pkill -x "MyOpenClaw" || true
          else
            echo "FAILED: App process not found"
            exit 1
          fi

      - name: Upload Mac screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-mac-${{ github.event.inputs.version }}
          path: ./screenshots/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: hdiutil detach /Volumes/MyOpenClaw -quiet || true

  verify-windows:
    runs-on: windows-latest
    steps:
      - name: Download Windows EXE
        run: |
          gh release download ${{ github.event.inputs.version }} `
            --repo myopenclaw-cyber/myopenclaw `
            --pattern "*windows*" `
            --dir ./artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell

      - name: Verify EXE file
        shell: powershell
        run: |
          $exe = Get-Item "./artifacts/*.exe"
          Write-Host "Name: $($exe.Name)  Size: $($exe.Length) bytes"
          if ($exe.Length -lt 10MB) {
            Write-Host "ERROR: EXE too small"; exit 1
          }
          $vi = $exe.VersionInfo
          Write-Host "Version: $($vi.FileVersion)  Product: $($vi.ProductName)"

      - name: Silent install
        shell: powershell
        run: |
          $exe = (Get-Item "./artifacts/*.exe").FullName
          Write-Host "Installing: $exe"
          Start-Process -FilePath $exe -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 5

      - name: Find installed app
        shell: powershell
        run: |
          $paths = @(
            "$env:LOCALAPPDATA\Programs\MyOpenClaw\MyOpenClaw.exe",
            "$env:ProgramFiles\MyOpenClaw\MyOpenClaw.exe",
            "$env:ProgramFiles(x86)\MyOpenClaw\MyOpenClaw.exe"
          )
          $appPath = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $appPath) {
            $appPath = Get-ChildItem -Path $env:LOCALAPPDATA, $env:ProgramFiles `
              -Recurse -Filter "MyOpenClaw.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $appPath) { Write-Host "ERROR: App not found"; exit 1 }
          Write-Host "Found: $appPath"
          "APP_PATH=$appPath" | Out-File -Append $env:GITHUB_ENV

      - name: Launch app and capture screenshots
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ./screenshots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          function Take-Screenshot($path) {
            $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap($screen.Width, $screen.Height)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
            $bmp.Save($path)
            $g.Dispose(); $bmp.Dispose()
            Write-Host "Screenshot saved: $path"
          }

          $proc = Start-Process -FilePath $env:APP_PATH -PassThru

          Start-Sleep -Seconds 4
          Take-Screenshot "./screenshots/win_01_loading.png"

          Start-Sleep -Seconds 5
          Take-Screenshot "./screenshots/win_02_main.png"

          Start-Sleep -Seconds 6
          Take-Screenshot "./screenshots/win_03_loaded.png"

          if (-not $proc.HasExited) {
            Write-Host "PASSED: App running after 15s (PID $($proc.Id))"
            $proc.Kill()
          } else {
            Write-Host "FAILED: App exited with code $($proc.ExitCode)"
            exit 1
          }

      - name: Upload Windows screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows-${{ github.event.inputs.version }}
          path: ./screenshots/
          retention-days: 7
